name: Vite Build & Deploy

on:
  push:
    branches:
      - default
  pull_request:
    branches:
      - default

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps 📦
        run: npm ci

      - name: Run tests 🧪
        run: npm run test --if-present

      - name: Build project 🏗️
        run: npm run build

      # 下面这段是部署到 GitHub Pages（如用 Vercel/Netlify 请删掉下面这块）
      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist   # Vite 的输出目录
          publish_branch: gh-pages     # 关键：改成你要的分支